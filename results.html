<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Results — CHEAPER</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .results-page {
      max-width: 1100px;
      margin: auto;
      padding: 80px 25px;
    }

    .results-header {
      text-align: center;
      margin-bottom: 50px;
    }

    .results-header h1 {
      font-size: clamp(45px, 7vw, 75px);
      margin-bottom: 20px;
    }

    .search-result {
      color: #777;
      font-size: 17px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .product-card {
      background: white;
      border: 1px solid #deddd8;
      border-radius: 16px;
      overflow: hidden;
    }

    .product-image {
      height: 260px;
      background: #e9e7e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .product-info {
      padding: 22px;
    }

    .store {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .product-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .price-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .price {
      font-size: 22px;
      font-weight: 800;
    }

    .old-price {
      color: #999;
      text-decoration: line-through;
      font-size: 14px;
    }

    .deal {
      display: inline-block;
      margin-top: 15px;
      padding: 7px 10px;
      background: #e7e5df;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
    }

    .save-button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: 1px solid #171717;
      background: white;
      color: #171717;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-button:hover {
      background: #171717;
      color: white;
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 50px auto 0;
      padding: 14px 22px;
      background: #171717;
      color: white;
      text-decoration: none;
      border-radius: 9px;
      font-weight: 700;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 50px;
      grid-column: 1 / -1;
    }

    .error-message {
      text-align: center;
      color: #777;
      padding: 50px;
      grid-column: 1 / -1;
    }

    @media (max-width: 800px) {
      .results-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      CHEAPER<span>.</span>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="saved.html">Saved</a>
      <a href="about.html">About</a>
    </nav>

  </header>

  <main>

    <section class="results-page">

      <div class="results-header">

        <p class="eyebrow">
          CHEAPER RESULTS
        </p>

        <h1>We found some options.</h1>

        <p class="search-result">
          Searching for:
          <strong id="searchText"></strong>
        </p>

      </div>

      <div id="resultsGrid" class="results-grid">

        <div class="loading">
          Loading results...
        </div>

      </div>

      <a href="index.html" class="back-button">
        ← Search for another item
      </a>

    </section>

  </main>

  <footer>

    <p>
      © 2026 CHEAPER. Find it for less.
    </p>

  </footer>

  <script>

    const BACKEND_URL =
      "https://cheaper-backend.vercel.app";

    const search =
      localStorage.getItem("cheaperSearch");

    const searchText =
      document.getElementById("searchText");

    const resultsGrid =
      document.getElementById("resultsGrid");

    searchText.textContent =
      search || "your clothing item";

    async function loadResults() {

      if (!search) {

        resultsGrid.innerHTML = `
          <div class="error-message">
            No search was found.
          </div>
        `;

        return;

      }

      try {

        const response =
          await fetch(`${BACKEND_URL}/search`, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              query: search
            })

          });

        if (!response.ok) {
          throw new Error("Search failed");
        }

        const data =
          await response.json();

        resultsGrid.innerHTML = "";

        data.products.forEach(product => {

          const card =
            document.createElement("div");

          card.className = "product-card";

          const savings =
            product.originalPrice - product.price;

          card.innerHTML = `

            <div class="product-image">
              ${product.image || "👕"}
            </div>

            <div class="product-info">

              <div class="store">
                ${product.store}
              </div>

              <div class="product-name">
                ${product.name}
              </div>

              <div class="price-row">

                <span class="price">
                  $${product.price.toFixed(2)}
                </span>

                <span class="old-price">
                  $${product.originalPrice.toFixed(2)}
                </span>

              </div>

              <span class="deal">
                SAVE $${savings.toFixed(2)}
              </span>

              <button class="save-button">
                ♡ Save
              </button>

            </div>

          `;

          const saveButton =
            card.querySelector(".save-button");

          saveButton.addEventListener("click", () => {

            saveItem(
              product.name,
              `$${product.price.toFixed(2)}`,
              product.image
            );

            saveButton.textContent = "✓ Saved";

          });

          resultsGrid.appendChild(card);

        });

      } catch (error) {

        console.error(error);

        resultsGrid.innerHTML = `
          <div class="error-message">
            Something went wrong while loading your results.
          </div>
        `;

      }

    }

    function saveItem(name, price, image) {

      let savedItems =
        JSON.parse(
          localStorage.getItem("cheaperSavedItems")
        ) || [];

      const alreadySaved =
        savedItems.some(
          item => item.name === name
        );

      if (alreadySaved) {
        alert("This item is already saved!");
        return;
      }

      savedItems.push({
        name: name,
        price: price,
        image: image
      });

      localStorage.setItem(
        "cheaperSavedItems",
        JSON.stringify(savedItems)
      );

    }

    loadResults();

  </script>

</body>

</html>
