<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHEAPER — Results</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .results-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 70px 25px;
    }

    .results-top {
      text-align: center;
      margin-bottom: 45px;
    }

    .results-top h1 {
      font-size: clamp(40px, 6vw, 65px);
      margin-bottom: 15px;
    }

    .results-top p {
      color: #666;
      font-size: 16px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .product-card {
      background: white;
      border: 1px solid #deddd8;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    .product-image {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background: #f1f0ec;
      display: block;
    }

    .no-image {
      height: 280px;
      background: #f1f0ec;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
    }

    .product-info {
      padding: 22px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-name {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    .store-name {
      color: #777;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .price {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .savings {
      color: #287a45;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .buy-button {
      display: block;
      width: 100%;
      padding: 13px;
      background: #171717;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      margin-top: auto;
    }

    .buy-button:hover {
      background: #333;
    }

    .save-button {
      display: block;
      width: 100%;
      padding: 11px;
      background: transparent;
      color: #555;
      border: 1px solid #d6d5d0;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 9px;
    }

    .save-button:hover {
      background: #f5f4f0;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 30px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .back-button:hover {
      color: #000;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 80px 20px;
    }

    .error {
      text-align: center;
      color: #777;
      padding: 80px 20px;
    }

    @media (max-width: 900px) {
      .results-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .results-grid {
        grid-template-columns: 1fr;
      }

      .results-page {
        padding: 45px 18px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">CHEAPER<span>.</span></div>

    <nav>
      <a href="index.html">Home</a>
      <a href="saved.html">Saved</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="results-page">

    <a href="index.html" class="back-button">← Search again</a>

    <section class="results-top">
      <p class="eyebrow">CHEAPER RESULTS</p>

      <h1>We found these.</h1>

      <p id="searchText">Searching...</p>
    </section>

    <section id="results" class="results-grid">
      <div class="loading">
        Searching stores...
      </div>
    </section>

  </main>

  <footer>
    <p>© 2026 CHEAPER. Find it for less.</p>
  </footer>


  <script>

    const BACKEND_URL = "https://cheaper-backend.vercel.app";

    const resultsContainer = document.getElementById("results");
    const searchText = document.getElementById("searchText");

    const query = localStorage.getItem("cheaperSearch");


    if (!query) {

      searchText.textContent = "No search found.";

      resultsContainer.innerHTML = `
        <div class="error">
          <p>Go back and search for a clothing item.</p>
        </div>
      `;

    } else {

      searchText.textContent = `Results for "${query}"`;

      searchProducts();

    }


    async function searchProducts() {

      try {

        const response = await fetch(`${BACKEND_URL}/search`, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            query: query
          })

        });


        if (!response.ok) {
          throw new Error("Search failed");
        }


        const data = await response.json();


        if (!data.products || data.products.length === 0) {

          resultsContainer.innerHTML = `
            <div class="error">
              <p>No products were found.</p>
            </div>
          `;

          return;

        }


        resultsContainer.innerHTML = "";


        data.products.forEach((product, index) => {

          const card = document.createElement("article");

          card.className = "product-card";


          // IMAGE

          if (product.image) {

            const image = document.createElement("img");

            image.className = "product-image";

            image.src = product.image;

            image.alt = product.name || "Clothing item";

            image.onerror = function() {
              this.replaceWith(createNoImage());
            };

            card.appendChild(image);

          } else {

            card.appendChild(createNoImage());

          }


          // INFO

          const info = document.createElement("div");

          info.className = "product-info";


          const name = document.createElement("div");

          name.className = "product-name";

          name.textContent = product.name || "Product";


          const store = document.createElement("div");

          store.className = "store-name";

          store.textContent = product.store || "Online Store";


          const price = document.createElement("div");

          price.className = "price";

          const productPrice = Number(product.price);

          price.textContent =
            Number.isFinite(productPrice) && productPrice > 0
              ? `$${productPrice.toFixed(2)}`
              : "Price unavailable";


          info.appendChild(name);

          info.appendChild(store);

          info.appendChild(price);


          // SAVINGS

          const originalPrice = Number(product.originalPrice);

          if (
            Number.isFinite(originalPrice) &&
            Number.isFinite(productPrice) &&
            originalPrice > productPrice
          ) {

            const savings = document.createElement("div");

            savings.className = "savings";

            savings.textContent =
              `Save $${(originalPrice - productPrice).toFixed(2)}`;

            info.appendChild(savings);

          }


          // BUY BUTTON

          if (product.url) {

            const buyButton = document.createElement("a");

            buyButton.className = "buy-button";

            buyButton.href = product.url;

            buyButton.target = "_blank";

            buyButton.rel = "noopener noreferrer";

            buyButton.textContent = "View / Buy";


            info.appendChild(buyButton);

          }


          // SAVE BUTTON

          const saveButton = document.createElement("button");

          saveButton.className = "save-button";

          saveButton.textContent = "♡ Save";


          saveButton.addEventListener("click", () => {

            const savedItems =
              JSON.parse(localStorage.getItem("savedProducts")) || [];


            const alreadySaved = savedItems.some(item =>
              item.url === product.url
            );


            if (!alreadySaved) {

              savedItems.push(product);

              localStorage.setItem(
                "savedProducts",
                JSON.stringify(savedItems)
              );

              saveButton.textContent = "✓ Saved";

            } else {

              saveButton.textContent = "✓ Already saved";

            }

          });


          info.appendChild(saveButton);

          card.appendChild(info);

          resultsContainer.appendChild(card);

        });


      } catch (error) {

        console.error(error);

        resultsContainer.innerHTML = `
          <div class="error">
            <p>Something went wrong while finding products.</p>
            <p>Please try searching again.</p>
          </div>
        `;

      }

    }


    function createNoImage() {

      const div = document.createElement("div");

      div.className = "no-image";

      div.textContent = "Image unavailable";

      return div;

    }

  </script>

</body>
</html>
