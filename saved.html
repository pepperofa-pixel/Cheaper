<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Saved — CHEAPER</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .saved-page {
      max-width: 1100px;
      margin: auto;
      padding: 80px 25px;
    }

    .saved-header {
      text-align: center;
      margin-bottom: 50px;
    }

    .saved-header h1 {
      font-size: clamp(50px, 8vw, 80px);
      margin-bottom: 20px;
    }

    .saved-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .saved-card {
      background: white;
      border: 1px solid #deddd8;
      border-radius: 16px;
      overflow: hidden;
    }

    .saved-image {
      height: 240px;
      background: #e9e7e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .saved-info {
      padding: 22px;
    }

    .saved-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .saved-price {
      font-size: 21px;
      font-weight: 800;
    }

    .remove-button {
      margin-top: 18px;
      border: 1px solid #d6d5d0;
      background: transparent;
      padding: 9px 14px;
      border-radius: 7px;
      cursor: pointer;
    }

    .remove-button:hover {
      background: #171717;
      color: white;
    }

    .empty-message {
      text-align: center;
      color: #777;
      padding: 60px 20px;
    }

    @media (max-width: 800px) {
      .saved-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      CHEAPER<span>.</span>
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="saved.html">Saved</a>
      <a href="about.html">About</a>
    </nav>

  </header>


  <main>

    <section class="saved-page">

      <div class="saved-header">

        <p class="eyebrow">
          YOUR ITEMS
        </p>

        <h1>Saved.</h1>

        <p class="subtitle">
          Your favorite cheaper finds will appear here.
        </p>

      </div>


      <div id="savedGrid" class="saved-grid"></div>


      <div id="emptyMessage" class="empty-message">
        You haven't saved anything yet.
      </div>

    </section>

  </main>


  <footer>

    <p>
      © 2026 CHEAPER. Find it for less.
    </p>

  </footer>


  <script>

    const savedGrid =
      document.getElementById("savedGrid");

    const emptyMessage =
      document.getElementById("emptyMessage");


    let savedItems =
      JSON.parse(
        localStorage.getItem("cheaperSavedItems")
      ) || [];


    function displaySavedItems() {

      savedGrid.innerHTML = "";


      if (savedItems.length === 0) {

        emptyMessage.style.display = "block";

        return;

      }


      emptyMessage.style.display = "none";


      savedItems.forEach((item, index) => {

        const card =
          document.createElement("div");

        card.className = "saved-card";


        card.innerHTML = `

          <div class="saved-image">
            ${item.image || "👕"}
          </div>

          <div class="saved-info">

            <div class="saved-name">
              ${item.name}
            </div>

            <div class="saved-price">
              ${item.price}
            </div>

            <button
              class="remove-button"
              onclick="removeItem(${index})">
              Remove
            </button>

          </div>

        `;


        savedGrid.appendChild(card);

      });

    }


    function removeItem(index) {

      savedItems.splice(index, 1);


      localStorage.setItem(
        "cheaperSavedItems",
        JSON.stringify(savedItems)
      );


      displaySavedItems();

    }


    displaySavedItems();

  </script>

</body>

</html>
